<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Awesome CLIP Test-Time Adaptation</title>
<meta name="description" content="A curated list of papers on test-time adaptation of CLIP and vision-language models.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --fg: #171717;
    --fg-2: #525252;
    --fg-3: #8a8a8a;
    --border: #e6e6e6;
    --hover: #fafafa;
    --track: #f0f0f0;
    --zebra: #f5f8ff;
    --zebra-hover: #ecf2ff;
    --accent: #2e86f0;
    --accent-hover: #1d6fd8;
    --bar-grad: linear-gradient(90deg, #b7cff9 0%, #9dbdf6 100%);
  }
  html.dark {
    --bg: #0a0a0a;
    --fg: #ededed;
    --fg-2: #a3a3a3;
    --fg-3: #6b6b6b;
    --border: #262626;
    --hover: #141414;
    --track: #1f1f1f;
    --zebra: #0e1524;
    --zebra-hover: #141e33;
    --accent: #6da2f8;
    --accent-hover: #8fb8fa;
    --bar-grad: linear-gradient(90deg, #5479c9 0%, #4668b3 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 15px;
    line-height: 1.55;
    transition: background .2s ease, color .2s ease;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-hover); }

  /* ---------- Top bar ---------- */
  .topbar {
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .topbar-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 56px;
  }
  .wordmark { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; color: var(--fg); }
  .topbar-right { display: flex; align-items: center; gap: 18px; }
  .topbar-right a { font-size: 13px; color: var(--fg-2); font-weight: 500; }
  .topbar-right a:hover { color: var(--fg); }
  .icon-btn {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    width: 30px; height: 30px; cursor: pointer; color: var(--fg-2);
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: var(--fg); border-color: var(--fg-3); }

  /* ---------- Hero ---------- */
  .hero { padding: 72px 0 40px; }
  .hero h1 {
    font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15;
  }
  .hero p {
    margin-top: 14px; font-size: 16px; color: var(--fg-2); max-width: 640px;
  }
  .hero .meta { margin-top: 20px; font-size: 13px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
  .hero .meta strong { color: var(--fg-2); font-weight: 600; }

  /* ---------- Chart ---------- */
  .section { padding: 8px 0 40px; }
  .section-title {
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--fg-3); margin-bottom: 20px;
  }
  .chart { display: flex; flex-direction: column; gap: 6px; }
  .bar-row {
    display: grid; grid-template-columns: 110px 1fr 32px; align-items: center;
    gap: 12px; border: none; background: none; padding: 0; cursor: pointer;
    font: inherit; text-align: left; color: inherit;
  }
  .bar-label {
    font-size: 13px; font-weight: 500; color: var(--fg-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bar-row:hover .bar-label, .bar-row.active .bar-label { color: var(--fg); }
  .bar-track { height: 20px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bar-fill {
    display: block; height: 100%; background: var(--bar-grad); border-radius: 3px;
    transition: width .5s cubic-bezier(.2,.8,.2,1);
  }
  .bar-row.active .bar-fill { filter: brightness(0.92); }
  .bar-count {
    font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; text-align: right;
  }
  .chart-toggle {
    margin-top: 14px; background: none; border: none; padding: 0; cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--fg-2); font-family: inherit;
  }
  .chart-toggle:hover { color: var(--fg); }

  /* ---------- Filters ---------- */
  .controls {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 24px 0; border-top: 1px solid var(--border);
  }
  .search {
    flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 6px; padding: 0 12px; height: 36px;
  }
  .search:focus-within { border-color: var(--fg-3); }
  .search svg { color: var(--fg-3); flex-shrink: 0; }
  .search input {
    border: none; outline: none; background: none; width: 100%;
    font: inherit; font-size: 14px; color: var(--fg);
  }
  .search input::placeholder { color: var(--fg-3); }
  select, .check-label {
    height: 36px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: 13px;
    padding: 0 10px; cursor: pointer;
  }
  .check-label { display: flex; align-items: center; gap: 7px; user-select: none; }
  .check-label input { accent-color: var(--accent); margin: 0; }

  .years { display: flex; gap: 22px; padding: 0 0 20px; border-bottom: 1px solid var(--border); }
  .year-tab {
    background: none; border: none; padding: 0 0 12px; margin-bottom: -1px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--fg-3);
    border-bottom: 2px solid transparent; font-variant-numeric: tabular-nums;
  }
  .year-tab:hover { color: var(--fg-2); }
  .year-tab.active { color: var(--fg); border-bottom-color: var(--fg); }
  .year-tab .n { color: var(--fg-3); font-weight: 400; font-size: 12px; margin-left: 3px; }
  .year-tab.active .n { color: var(--fg-3); }

  /* ---------- Paper list ---------- */
  .year-group h2 {
    font-size: 20px; font-weight: 600; letter-spacing: -0.02em;
    padding: 36px 0 8px; font-variant-numeric: tabular-nums;
  }
  .paper {
    display: grid;
    grid-template-columns: minmax(72px, auto) 1fr auto auto;
    align-items: baseline; gap: 16px;
    padding: 12px 12px; border-radius: 6px;
  }
  .paper:nth-of-type(even) { background: var(--zebra); }
  .paper:hover { background: var(--zebra-hover); }
  .p-method { font-weight: 600; font-size: 13px; white-space: nowrap; }
  .p-method.empty { color: var(--fg-3); font-weight: 400; }
  .p-title { font-size: 14px; color: var(--fg-2); }
  .p-venue {
    font-size: 11px; font-weight: 500; color: var(--fg-2);
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .p-links { display: flex; gap: 12px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .p-links .disabled { color: var(--fg-3); font-weight: 400; cursor: default; }

  .empty-state { padding: 48px 0; color: var(--fg-3); font-size: 14px; }

  footer {
    border-top: 1px solid var(--border); margin-top: 48px;
    padding: 28px 0 48px; font-size: 13px; color: var(--fg-3);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }

  @media (max-width: 640px) {
    .hero { padding: 48px 0 32px; }
    .hero h1 { font-size: 27px; }
    .paper { grid-template-columns: 1fr auto; grid-template-areas: "method venue" "title title" "links links"; gap: 4px 12px; }
    .p-method { grid-area: method; }
    .p-title { grid-area: title; }
    .p-venue { grid-area: venue; justify-self: end; }
    .p-links { grid-area: links; }
    .bar-row { grid-template-columns: 84px 1fr 28px; gap: 8px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <span class="wordmark">Awesome CLIP-TTA</span>
    <div class="topbar-right">
      <a href="https://github.com/xyjie37/Awesome-CLIP-TTA" target="_blank" rel="noopener">GitHub ↗</a>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <h1>CLIP Test-Time Adaptation</h1>
    <p>A curated collection of papers on test-time adaptation of CLIP and vision-language models, 2022 – 2026.</p>
    <div class="meta" id="metaStats"></div>
  </section>

  <section class="section">
    <div class="section-title">Papers by venue</div>
    <div class="chart" id="chart"></div>
    <button class="chart-toggle" id="chartToggle">Show all venues ↓</button>
  </section>

  <div class="controls">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path>
      </svg>
      <input id="q" type="text" placeholder="Search papers or methods…" autocomplete="off">
    </div>
    <select id="venueSelect"><option value="">All venues</option></select>
    <label class="check-label"><input type="checkbox" id="hasCode"> Has code</label>
  </div>

  <nav class="years" id="yearTabs"></nav>

  <section id="list"></section>

</main>

<footer>
  <div class="wrap" style="display:contents">
    <span>Awesome CLIP Test-Time Adaptation</span>
    <span>Data generated from the repository README · <a href="https://github.com/xyjie37/Awesome-CLIP-TTA">contribute on GitHub</a></span>
  </div>
</footer>

<script src="data.js"></script>
<script>
(function () {
  const papers = DATA.papers;
  const CHART_PREVIEW = 12;

  /* ---------- theme ---------- */
  const themeBtn = document.getElementById('themeBtn');
  const saved = localStorage.getItem('tta-theme');
  if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }
  themeBtn.onclick = () => {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('tta-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
  };

  /* ---------- stats ---------- */
  const years = [...new Set(papers.map(p => p.year))].sort((a, b) => b - a);
  const venueCounts = {};
  papers.forEach(p => { venueCounts[p.venueFamily] = (venueCounts[p.venueFamily] || 0) + 1; });
  const venueList = Object.entries(venueCounts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const withCode = papers.filter(p => p.code).length;

  document.getElementById('metaStats').innerHTML =
    `<strong>${papers.length}</strong> papers &nbsp;·&nbsp; <strong>${withCode}</strong> with code &nbsp;·&nbsp; ` +
    `<strong>${venueList.length}</strong> venues &nbsp;·&nbsp; ${years[years.length - 1]}–${years[0]}`;

  /* ---------- state ---------- */
  const state = { q: '', venue: '', year: null, code: false };

  /* ---------- chart ---------- */
  const chartEl = document.getElementById('chart');
  const chartToggle = document.getElementById('chartToggle');
  let chartExpanded = false;
  const maxCount = venueList[0][1];

  function renderChart() {
    const shown = chartExpanded ? venueList : venueList.slice(0, CHART_PREVIEW);
    chartEl.innerHTML = '';
    shown.forEach(([v, n]) => {
      const row = document.createElement('button');
      row.className = 'bar-row' + (state.venue === v ? ' active' : '');
      row.innerHTML =
        `<span class="bar-label">${v}</span>` +
        `<span class="bar-track"><span class="bar-fill" style="width:${n / maxCount * 100}%"></span></span>` +
        `<span class="bar-count">${n}</span>`;
      row.onclick = () => {
        state.venue = state.venue === v ? '' : v;
        venueSelect.value = state.venue;
        renderChart(); renderList();
      };
      chartEl.appendChild(row);
    });
    chartToggle.style.display = venueList.length > CHART_PREVIEW ? '' : 'none';
    chartToggle.textContent = chartExpanded
      ? 'Show fewer venues ↑'
      : `Show all ${venueList.length} venues ↓`;
  }
  chartToggle.onclick = () => { chartExpanded = !chartExpanded; renderChart(); };

  /* ---------- controls ---------- */
  const q = document.getElementById('q');
  const venueSelect = document.getElementById('venueSelect');
  const hasCode = document.getElementById('hasCode');
  venueList.forEach(([v, n]) => {
    const o = document.createElement('option');
    o.value = v; o.textContent = `${v} (${n})`;
    venueSelect.appendChild(o);
  });
  q.oninput = () => { state.q = q.value.trim().toLowerCase(); renderList(); };
  venueSelect.onchange = () => { state.venue = venueSelect.value; renderChart(); renderList(); };
  hasCode.onchange = () => { state.code = hasCode.checked; renderList(); };

  /* ---------- year tabs ---------- */
  const yearTabs = document.getElementById('yearTabs');
  function renderTabs() {
    yearTabs.innerHTML = '';
    const tabs = [{ y: null, label: 'All', n: papers.length }]
      .concat(years.map(y => ({ y, label: y, n: papers.filter(p => p.year === y).length })));
    tabs.forEach(t => {
      const b = document.createElement('button');
      b.className = 'year-tab' + (state.year === t.y ? ' active' : '');
      b.innerHTML = `${t.label}<span class="n">${t.n}</span>`;
      b.onclick = () => { state.year = t.y; renderTabs(); renderList(); };
      yearTabs.appendChild(b);
    });
  }

  /* ---------- list ---------- */
  const list = document.getElementById('list');
  function filtered() {
    return papers.filter(p =>
      (!state.year || p.year === state.year) &&
      (!state.venue || p.venueFamily === state.venue) &&
      (!state.code || p.code) &&
      (!state.q || (p.title + ' ' + p.method).toLowerCase().includes(state.q))
    );
  }
  function renderList() {
    const rows = filtered();
    list.innerHTML = '';
    if (!rows.length) {
      list.innerHTML = '<div class="empty-state">No papers match the current filters.</div>';
      return;
    }
    (state.year ? [state.year] : years).forEach(y => {
      const group = rows.filter(p => p.year === y);
      if (!group.length) return;
      const g = document.createElement('div');
      g.className = 'year-group';
      g.innerHTML = `<h2>${y}</h2>`;
      group.forEach(p => {
        const el = document.createElement('div');
        el.className = 'paper';
        const method = p.method && p.method !== '—'
          ? `<span class="p-method">${p.method}</span>`
          : `<span class="p-method empty">—</span>`;
        const links =
          (p.paper ? `<a href="${p.paper}" target="_blank" rel="noopener">Paper</a>` : '') +
          (p.code ? `<a href="${p.code}" target="_blank" rel="noopener">Code</a>` : '<span class="disabled">Code</span>');
        el.innerHTML = method +
          `<span class="p-title">${p.title}</span>` +
          `<span class="p-venue">${p.venue}</span>` +
          `<span class="p-links">${links}</span>`;
        g.appendChild(el);
      });
      list.appendChild(g);
    });
  }

  renderChart();
  renderTabs();
  renderList();
})();
</script>
</body>
</html>
